<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Desk Horizon -->
  <path d="M 20 140 Q 100 145 180 140" stroke="#eab308" stroke-width="6" stroke-linecap="round" />
  <path d="M 40 160 Q 100 165 160 160" stroke="#eab308" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Rising Sun (Dawn) -->
  <circle cx="100" cy="110" r="40" fill="#eab308" />
  
  <!-- Abstract Rays -->
  <line x1="100" y1="40" x2="100" y2="55" stroke="#eab308" stroke-width="4" stroke-linecap="round" />
  <line x1="50" y1="60" x2="60" y2="70" stroke="#eab308" stroke-width="4" stroke-linecap="round" />
  <line x1="150" y1="60" x2="140" y2="70" stroke="#eab308" stroke-width="4" stroke-linecap="round" />
</svg>
